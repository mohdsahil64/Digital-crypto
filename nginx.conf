# Nginx config for Decentralized World on VPS
# Place at: /etc/nginx/sites-available/decentralized-world
# Enable:   sudo ln -s /etc/nginx/sites-available/decentralized-world /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain e.g. decentralizedworld.com
# SSL is handled by Certbot — run: sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot will add SSL redirect here automatically.

    # ── Frontend (React build — static files) ──────────────────────────────
    root /var/www/decentralized-world/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache static assets aggressively (hashed filenames by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API (proxy to Express on port 4000) ────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts (on-chain calls can be slow)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Don't expose Express error details
        proxy_intercept_errors off;
    }

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
