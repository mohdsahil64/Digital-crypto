<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060b1a"/>
      <stop offset="0.5" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#060b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="300" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1000 120) rotate(90) scale(360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(160 560) rotate(90) scale(320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a21caf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Brand row -->
  <g transform="translate(140 120)">
    <circle cx="26" cy="26" r="25" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M26 2 a30 30 0 0 0 0 48 a30 30 0 0 0 0 -48" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M2 26 h48" stroke="#38bdf8" stroke-width="3"/>
    <text x="72" y="38" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">Decentralized World</text>
  </g>

  <!-- Headline -->
  <text x="140" y="290" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="82" font-weight="700" fill="#f8fafc">Build income in the</text>
  <text x="140" y="390" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="82" font-weight="700" fill="url(#accent)">Decentralized World</text>

  <!-- Subline -->
  <text x="140" y="455" font-family="Inter, Arial, sans-serif" font-size="30" fill="#94a3b8">Wallet-based Web3 community on BNB Smart Chain.</text>
  <text x="140" y="497" font-family="Inter, Arial, sans-serif" font-size="30" fill="#94a3b8">Grow your team. Unlock daily rewards.</text>

  <!-- Pills -->
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">
    <rect x="140" y="540" width="230" height="54" rx="27" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="170" y="575">Instant activation</text>
    <rect x="390" y="540" width="200" height="54" rx="27" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="420" y="575">Daily payouts</text>
    <rect x="610" y="540" width="230" height="54" rx="27" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="640" y="575">Referral rewards</text>
  </g>
</svg>
